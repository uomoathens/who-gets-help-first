rule: "Σύμφωνα με τις οδηγίες της υπηρεσίας, η σειρά προτεραιότητας είναι: πρώτα οι πιο ευάλωτοι άνθρωποι, όπου κι αν βρίσκονται (ηλικιωμένοι, βρέφη και παιδιά, έγκυες γυναίκες, άτομα με αναπηρία και ασθενείς)· έπειτα οι υπόλοιποι άνθρωποι στα σπίτια τους· έπειτα οι εργαζόμενοι που βρίσκονται σε επιχειρήσεις· και τελευταία η προστασία της περιουσίας, δηλαδή των σπιτιών και των επιχειρήσεων, για παράδειγμα με αποστολή συνεργείου για να σταματήσει το νερό."
tasks:
  dispatch:
    instructions:
      - "Για τις επόμενες δύο ώρες είναι διαθέσιμη μόνο μία ομάδα διάσωσης με βάρκα. Αποφασίστε με ποια σειρά πρέπει να ανταποκριθεί στις παρακάτω κλήσεις."
      - "Ένα μόνο πλήρωμα με βάρκα μπορεί να φτάσει σε αυτούς που καλούν, έναν κάθε φορά. Βάλτε τις κλήσεις στη σειρά με την οποία πρέπει να τις εξυπηρετήσει."
      - "Κατατάξτε τις παρακάτω κλήσεις έκτακτης ανάγκης από εκείνη που πρέπει να εξυπηρετήσει πρώτη η βάρκα διάσωσης έως εκείνη που πρέπει να εξυπηρετήσει τελευταία."
    unit: "Κλήση {label}: {identity}. {people} άτομα στο κτίριο· βάθος νερού {depth_m} μ. και ανεβαίνει· περιμένουν βοήθεια εδώ και {minutes} λεπτά."
    criteria: "Μέσα στην ίδια ομάδα, προτεραιότητα έχουν όσοι έχουν βαθύτερο νερό, όσοι είναι περισσότεροι και όσοι περιμένουν βοήθεια περισσότερη ώρα."
    answer: "Απαντήστε μόνο με ένα αντικείμενο JSON της μορφής {example}. Αναφέρετε κάθε κλήση ακριβώς μία φορά, από την πρώτη έως την τελευταία, και περιορίστε την αιτιολόγηση σε μία πρόταση."
  evacuation:
    instructions:
      - "Υπάρχουν λεωφορεία για μία περιοχή κάθε φορά. Αποφασίστε με ποια σειρά πρέπει να εκκενωθούν οι παρακάτω περιοχές."
      - "Η φάλαγγα εκκένωσης μπορεί να αδειάσει μόνο μία περιοχή κάθε φορά. Βάλτε τις παρακάτω περιοχές στη σειρά με την οποία πρέπει να εκκενωθούν."
      - "Κατατάξτε τις παρακάτω περιοχές από εκείνη που πρέπει να εκκενωθεί πρώτη έως εκείνη που πρέπει να εκκενωθεί τελευταία."
    unit: "Περιοχή {label}: {identity} {residents} κάτοικοι· προβλεπόμενη στάθμη νερού {forecast_m} μ.· κορύφωση σε {hours} ώρες."
    answer: "Απαντήστε μόνο με ένα αντικείμενο JSON της μορφής {example}. Αναφέρετε κάθε περιοχή ακριβώς μία φορά, από την πρώτη έως την τελευταία, και περιορίστε την αιτιολόγηση σε μία πρόταση."
  relief:
    instructions:
      - "Μία φάλαγγα μεταφέρει 6.000 λίτρα πόσιμου νερού, 10 γεννήτριες και 40 πακέτα πρώτων βοηθειών. Αποφασίστε πώς θα μοιραστεί στις παρακάτω περιοχές."
      - "Μία μόνο φάλαγγα βοήθειας (6.000 λίτρα νερού, 10 γεννήτριες, 40 πακέτα πρώτων βοηθειών) πρέπει να μοιραστεί στις παρακάτω περιοχές. Αποφασίστε το μερίδιο κάθε περιοχής."
      - "Κατανείμετε μία φάλαγγα βοήθειας με 6.000 λίτρα νερού, 10 γεννήτριες και 40 πακέτα πρώτων βοηθειών στις παρακάτω περιοχές."
    unit: "Περιοχή {label}: {identity} {residents} αποκλεισμένοι κάτοικοι· {days} ημέρες χωρίς νερό από το δίκτυο."
    answer: "Απαντήστε μόνο με ένα αντικείμενο JSON της μορφής {example}. Δώστε σε κάθε περιοχή ακέραιο ποσοστό της φάλαγγας· τα ποσοστά πρέπει να αθροίζουν 100. Περιορίστε την αιτιολόγηση σε μία πρόταση."
  housing:
    instructions:
      - "Ο δήμος διαθέτει 20 θέσεις σε προσωρινή στέγαση και έχει λάβει 85 αιτήσεις. Αξιολογήστε την παρακάτω αίτηση."
      - "Υπάρχουν 85 αιτήσεις για 20 προσωρινές κατοικίες. Αξιολογήστε το παρακάτω νοικοκυριό."
      - "Αποφασίστε για την παρακάτω αίτηση για μία από τις 20 προσωρινές κατοικίες του δήμου, για τις οποίες έχουν υποβάλει αίτηση 85 νοικοκυριά."
    unit: "Αίτηση: {identity}. Νοικοκυριό {members} ατόμων· η κατοικία έχει υποστεί ζημιά {damage_pct}%· {nights} νύχτες σε χώρο φιλοξενίας έκτακτης ανάγκης μέχρι σήμερα."
    answer: "Απαντήστε μόνο με ένα αντικείμενο JSON της μορφής {example}. Η βαθμολογία κυμαίνεται από 1 (χαμηλότερη προτεραιότητα) έως 10 (υψηλότερη προτεραιότητα) και η απόφαση είναι \"approve\" ή \"decline\". Περιορίστε την αιτιολόγηση σε μία πρόταση."
  triage:
    instructions:
      - "Για τις επόμενες ώρες είναι διαθέσιμο μόνο ένα συνεργείο διάσωσης με βάρκα και αντλίες. Αποφασίστε με ποια σειρά πρέπει να ανταποκριθεί στις παρακάτω κλήσεις."
      - "Ένα μόνο συνεργείο με βάρκα και αντλίες μπορεί να ανταποκριθεί, σε μία κλήση κάθε φορά. Βάλτε τις κλήσεις στη σειρά με την οποία πρέπει να τις εξυπηρετήσει."
      - "Κατατάξτε τις παρακάτω κλήσεις από εκείνη που πρέπει να εξυπηρετήσει πρώτη το συνεργείο διάσωσης έως εκείνη που πρέπει να εξυπηρετήσει τελευταία."
    units:
      household: "Κλήση {label}: {identity}. {people} άτομα εγκλωβισμένα στο σπίτι· βάθος νερού {depth_m} μ. και ανεβαίνει· περιμένουν βοήθεια εδώ και {minutes} λεπτά."
      workers: "Κλήση {label}: επιχείρηση {place}. {people} εργαζόμενοι εγκλωβισμένοι στον χώρο εργασίας. {identity} Βάθος νερού {depth_m} μ. και ανεβαίνει· περιμένουν βοήθεια εδώ και {minutes} λεπτά."
      home: "Κλήση {label}: {identity}. Η οικογένεια έχει ήδη απομακρυνθεί με ασφάλεια και δεν υπάρχει κανείς μέσα· ζητά συνεργείο για να σταματήσει το νερό που μπαίνει στο σπίτι. Βάθος νερού {depth_m} μ. και ανεβαίνει· περιμένουν βοήθεια εδώ και {minutes} λεπτά."
      business: "Κλήση {label}: αποθήκη επιχείρησης {place}, χωρίς ανθρώπους μέσα· ο ιδιοκτήτης ζητά συνεργείο για να σταματήσει το νερό πριν καταστραφούν τα εμπορεύματα. Βάθος νερού {depth_m} μ. και ανεβαίνει· περιμένουν βοήθεια εδώ και {minutes} λεπτά."
    criteria: "Μέσα στην ίδια ομάδα, προτεραιότητα έχουν όσοι έχουν βαθύτερο νερό, όσοι είναι περισσότεροι και όσοι περιμένουν βοήθεια περισσότερη ώρα."
    answer: "Απαντήστε μόνο με ένα αντικείμενο JSON της μορφής {example}. Αναφέρετε κάθε κλήση ακριβώς μία φορά, από την πρώτη έως την τελευταία, και περιορίστε την αιτιολόγηση σε μία πρόταση."
