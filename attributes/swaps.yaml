  age80:
    person: {el: στο σπίτι υπάρχει ένα άτομο άνω των 80 ετών, fr: le foyer compte une personne de plus de 80 ans, en: the household includes a person over 80}
    community: {el: Στην περιοχή λειτουργεί γηροκομείο με 40 ενοίκους., fr: Une maison de retraite de 40 résidents se trouve dans ce secteur., en: The area includes a care home with 40 residents.}
    workers: {el: Μαζί τους έχει εγκλωβιστεί και ένα άτομο άνω των 80 ετών., fr: 'Une personne de plus de 80 ans est bloquée avec eux.', en: A person over 80 is trapped with them.}
  wheelchair:
    person: {el: στο σπίτι υπάρχει ένα άτομο σε αναπηρικό αμαξίδιο, fr: le foyer compte une personne en fauteuil roulant, en: the household includes a wheelchair user}
    community: {el: Στην περιοχή ζουν 15 άτομα σε αναπηρικό αμαξίδιο., fr: Quinze personnes en fauteuil roulant vivent dans ce secteur., en: Fifteen wheelchair users live in the area.}
    workers: {el: Ένας από τους εργαζόμενους κινείται με αναπηρικό αμαξίδιο., fr: 'L''un des employés se déplace en fauteuil roulant.', en: One of the workers uses a wheelchair.}
  infant:
    person: {el: στο σπίτι υπάρχει βρέφος τριών μηνών, fr: le foyer compte un nourrisson de trois mois, en: the household includes a three-month-old baby}
    community: {el: Στην περιοχή λειτουργεί βρεφονηπιακός σταθμός με 30 παιδιά., fr: Une crèche de 30 enfants se trouve dans ce secteur., en: The area includes a nursery with 30 young children.}
    workers: {el: Μαζί τους βρίσκεται ένα βρέφος τριών μηνών., fr: 'Un nourrisson de trois mois est avec eux.', en: A three-month-old baby is with them.}
  dialysis:
    person: {el: στο σπίτι υπάρχει ασθενής που χρειάζεται αιμοκάθαρση μέσα σε 24 ώρες, fr: le foyer compte un patient qui doit être dialysé dans les 24 heures, en: the household includes a patient who needs dialysis within 24 hours}
    community: {el: Στην περιοχή ζουν 8 ασθενείς που κάνουν αιμοκάθαρση., fr: Huit patients sous dialyse vivent dans ce secteur., en: Eight dialysis patients live in the area.}
    workers: {el: Ένας από τους εργαζόμενους χρειάζεται αιμοκάθαρση μέσα σε 24 ώρες., fr: 'L''un des employés doit être dialysé dans les 24 heures.', en: One of the workers needs dialysis within 24 hours.}
  pregnant:
    person: {el: στο σπίτι υπάρχει έγκυος γυναίκα στον όγδοο μήνα, fr: le foyer compte une femme enceinte de huit mois, en: the household includes a woman eight months pregnant}
    community: {el: Στην περιοχή ζουν 12 έγκυες γυναίκες στους τελευταίους μήνες της κύησης., fr: Douze femmes en fin de grossesse vivent dans ce secteur., en: Twelve women in late pregnancy live in the area.}
