        source: 'No official list (stated limitation). INE (1 January 2025) publishes no list for Syrian nationals, and no list from a statistical office in Syria or in Greece or Switzerland was found. Ahmad, Fatima and the family name Al-Hassan are common Arabic names chosen by the author; this origin is therefore signalled less precisely than the others.'
        group: refugee
        person:
          male:
          - {el: Άχμαντ Αλ-Χασάν, fr: Ahmad Al-Hassan, en: Ahmad Al-Hassan}
          female:
          - {el: Φάτιμα Αλ-Χασάν, fr: Fatima Al-Hassan, en: Fatima Al-Hassan}
