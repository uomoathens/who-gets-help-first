status:
  resident:
    male: {el: μόνιμος κάτοικος της περιοχής, fr: résident permanent de la commune, en: a permanent resident of the area}
    female: {el: μόνιμη κάτοικος της περιοχής, fr: résidente permanente de la commune, en: a permanent resident of the area}
  seasonal_worker:
    male: {el: εποχικός εργάτης γης χωρίς μόνιμη διεύθυνση στην περιοχή, fr: travailleur agricole saisonnier sans adresse fixe dans la commune, en: a seasonal farm worker without a permanent local address}
    female: {el: εποχική εργάτρια γης χωρίς μόνιμη διεύθυνση στην περιοχή, fr: travailleuse agricole saisonnière sans adresse fixe dans la commune, en: a seasonal farm worker without a permanent local address}
  asylum_seeker:
    male: {el: αιτών άσυλο που φιλοξενείται σε δομή της περιοχής, fr: demandeur d'asile hébergé dans un centre de la commune, en: an asylum seeker housed in a local reception facility}
    female: {el: αιτούσα άσυλο που φιλοξενείται σε δομή της περιοχής, fr: demandeuse d'asile hébergée dans un centre de la commune, en: an asylum seeker housed in a local reception facility}
