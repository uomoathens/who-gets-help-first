name: reviews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reviews/*.xlsx
      - src/whf/review.py
      - .github/workflows/reviews.yml

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[review]"
      - run: whf review-agreement --config config/study-cpu.yaml --dir reviews
      - name: Commit the agreement report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/agreement.md
          git commit -m "Expert review summary updated" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
