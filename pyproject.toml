[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "who-gets-help-first"
version = "0.2.0"
description = "Counterfactual audit of large language model decisions in flood and natural-disaster response"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dimitrios Sargiotis"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
analysis = ["statsmodels>=0.14", "matplotlib>=3.7"]
hf = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.30", "bitsandbytes>=0.43"]
dev = ["pytest>=7"]

[project.scripts]
whf = "whf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
